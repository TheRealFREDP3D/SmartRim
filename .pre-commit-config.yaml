repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks secret scan
        entry: gitleaks detect --source . --config .gitleaks.toml
        language: system
        pass_filenames: false
      - id: validate-lessons
        name: Validate lessons.jsonl
        entry: python -m smartrim.situation validate
        language: system
        pass_filenames: false
      - id: ruff
        name: Ruff lint
        entry: python -m ruff check sidecar tests
        language: system
        pass_filenames: false
      - id: pytest
        name: Run test suite
        entry: python -m pytest
        language: system
        pass_filenames: false
