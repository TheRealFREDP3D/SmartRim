repos:
  - repo: local
    hooks:
      - id: validate-lessons
        name: Validate lessons.jsonl
        entry: python sidecar/lessons.py validate
        language: system
        pass_filenames: false
      - id: ruff
        name: Ruff lint
        entry: python -m ruff check sidecar tests
        language: system
        pass_filenames: false
      - id: pytest
        name: Run test suite
        entry: python -m pytest
        language: system
        pass_filenames: false