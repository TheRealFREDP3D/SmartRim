[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartrim"
version = "0.2.0"
description = "SmartRim sidecar tooling"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "mcp",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "tenacity",
]
cloud = [
    "openai",
    "anthropic",
]
dashboard = [
    "streamlit",
    "pandas",
    "plotly",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
